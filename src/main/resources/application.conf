ktor {
    deployment {
        port = 8080
        port = ${?PORT}
    }
    application {
        modules = [ com.ges.ApplicationKt.module ]
    }
}

app {
    storage = "memory"
    storage = ${?STORAGE}

    databasePath = "data/phrases.db"
    databasePath = ${?DATABASE_PATH}

    pageSize = 20
    pageSize = ${?PAGE_SIZE}

    maxPageSize = 100
    maxPageSize = ${?MAX_PAGE_SIZE}

    maxEmojiLength = 32
    maxEmojiLength = ${?MAX_EMOJI_LENGTH}

    maxPhraseLength = 280
    maxPhraseLength = ${?MAX_PHRASE_LENGTH}
}
