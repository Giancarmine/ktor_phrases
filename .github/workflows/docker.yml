name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Compute image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          load: ${{ github.event_name == 'pull_request' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        env:
          EVENT_NAME: ${{ github.event_name }}
          IMAGE_NAME: ${{ steps.image.outputs.name }}
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            image="$IMAGE_NAME:$IMAGE_VERSION"
          else
            image="$(printf '%s\n' "$IMAGE_TAGS" | head -n1)"
            docker pull "$image"
          fi

          docker run --detach --rm --name ktor-phrases-smoke \
            --publish 18080:8080 \
            --env STORAGE=sqlite \
            --env DATABASE_PATH=/app/data/phrases.db \
            "$image"

          cleanup() { docker rm --force ktor-phrases-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for attempt in $(seq 1 40); do
            if curl --fail --silent http://localhost:18080/health >/dev/null; then
              break
            fi
            sleep 0.5
          done

          curl --fail --silent http://localhost:18080/health
          curl --fail --silent http://localhost:18080/ready
          curl --fail --silent --request POST \
            --header 'Content-Type: application/json' \
            --data '{"emoji":"☕","phrase":"Smoke test"}' \
            http://localhost:18080/api/v1/phrases
          curl --fail --silent http://localhost:18080/api/v1/phrases | grep -q 'Smoke test'
